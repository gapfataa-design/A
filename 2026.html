<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Love You</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000000;
      color: #dff6ff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 36px;
    }

    .scene {
      width: min(520px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title {
      font-family: 'Pacifico', cursive;
      font-size: clamp(2.1rem, 6vw, 2.8rem);
      font-weight: 400;
      color: #b4f0ff;
      text-shadow:
        0 0 8px rgba(125, 211, 252, 0.95),
        0 0 22px rgba(56, 189, 248, 0.8),
        0 0 42px rgba(14, 165, 233, 0.55);
      margin-bottom: -10px;
      z-index: 2;
      user-select: none;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 430px;
      aspect-ratio: 1 / 0.92;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    .floor-glow {
      position: absolute;
      bottom: 10%;
      width: 58%;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(165, 243, 252, 0.85) 0%,
        rgba(56, 189, 248, 0.35) 45%,
        transparent 75%
      );
      filter: blur(6px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="scene">
    <h1 class="title">Te quiero</h1>

    <div class="canvas-wrap">
      <canvas id="heartCanvas" width="800" height="720"></canvas>
      <div class="floor-glow"></div>
    </div>
  </main>

  <script>
    var Point = (function () {
      function Point(x, y) {
        this.x = (typeof x !== 'undefined') ? x : 0;
        this.y = (typeof y !== 'undefined') ? y : 0;
      }
      Point.prototype.clone = function () {
        return new Point(this.x, this.y);
      };
      return Point;
    })();

    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    const COUNT = 2600;
    const particles = [];
    const dustBed = [];
    let t = 0;
    let pulseWave = 0;

    function heartFormula(angle, scale) {
      const x = 16 * Math.pow(Math.sin(angle), 3);
      const y = -(
        13 * Math.cos(angle) -
        5 * Math.cos(2 * angle) -
        2 * Math.cos(3 * angle) -
        Math.cos(4 * angle)
      );
      return new Point(x * scale, y * scale);
    }

    for (let i = 0; i < COUNT; i++) {
      const angle = Math.random() * Math.PI * 2;
      const onRim = i % 3 === 0;
      const r = onRim
        ? 0.91 + Math.random() * 0.09
        : 0.12 + Math.pow(Math.random(), 0.48) * 0.82;

      const target = heartFormula(angle, r);

      particles.push({
        target,
        pos: new Point(
          (Math.random() - 0.5) * 440,
          205 + (Math.random() - 0.5) * 32
        ),
        vel: new Point(0, 0),
        size: onRim ? 1.2 + Math.random() * 1.5 : 0.8 + Math.random() * 1.2,
        alpha: 0.4 + Math.random() * 0.6,
        phase: Math.random() * Math.PI * 2
      });
    }

    for (let i = 0; i < 320; i++) {
      const a = Math.random() * Math.PI * 2;
      const rad = Math.sqrt(Math.random());
      dustBed.push({
        ox: Math.cos(a) * rad * 215,
        oy: Math.sin(a) * rad * 16,
        size: 0.8 + Math.random() * 1.4,
        phase: Math.random() * Math.PI * 2,
        speed: 0.6 + Math.random() * 1.2
      });
    }

    canvas.addEventListener('click', () => {
      pulseWave = 1;
    });

    function animate() {
      requestAnimationFrame(animate);
      t += 0.02;
      pulseWave = Math.max(0, pulseWave - 0.018);

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width * 0.5;
      const cy = canvas.height * 0.45;
      const floorY = canvas.height * 0.82;

      const aura = ctx.createRadialGradient(cx, cy, 10, cx, cy, 240);
      aura.addColorStop(0, 'rgba(56, 189, 248, 0.16)');
      aura.addColorStop(0.55, 'rgba(14, 165, 233, 0.05)');
      aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = aura;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < dustBed.length; i++) {
        const d = dustBed[i];
        const bx = cx + d.ox + Math.sin(t * d.speed + d.phase) * 6;
        const by = floorY + d.oy + Math.cos(t * d.speed + d.phase) * 2.5;
        const bAlpha = 0.25 + 0.5 * Math.sin(t * 2.8 + d.phase);
        ctx.beginPath();
        ctx.arc(bx, by, d.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(155, 235, 255, ${Math.max(0.08, bAlpha).toFixed(3)})`;
        ctx.fill();
      }

      const rise = Math.min(1, t / 2.4);
      const ease = 1 - Math.pow(1 - rise, 3);
      const beat = 1 + 0.045 * Math.sin(t * 3.2) + 0.14 * pulseWave;
      const heartScale = 15.2 * beat;

      for (let i = 0; i < COUNT; i++) {
        const p = particles[i];

        const goalX = p.target.x * heartScale;
        const goalY = p.target.y * heartScale;

        const startX = p.target.x * 13 + Math.sin(p.phase + t) * 16;
        const startY = 205 + Math.cos(p.phase + t) * 10;

        const tx = startX + (goalX - startX) * ease;
        const ty = startY + (goalY - startY) * ease;

        p.vel.x = (p.vel.x + (tx - p.pos.x) * 0.055) * 0.82;
        p.vel.y = (p.vel.y + (ty - p.pos.y) * 0.055) * 0.82;

        p.pos.x += p.vel.x;
        p.pos.y += p.vel.y;

        const twinkle = 0.58 + 0.42 * Math.sin(t * 4.5 + p.phase);
        const alpha = Math.min(1, p.alpha * twinkle * (0.35 + 0.65 * ease));

        ctx.beginPath();
        ctx.arc(cx + p.pos.x, cy + p.pos.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(120, 224, 255, ${alpha.toFixed(3)})`;
        ctx.fill();
      }
    }

    animate();
  </script>
</body>
</html>
